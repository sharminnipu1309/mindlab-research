name: Room Unlock Email Cron Worker

on:
  # Temporarily paused: automatic schedule disabled until custom sending domain is verified in Resend.
  # Prevents exhausting database retry attempts (attempt 4/5 reached on pending participants).
  # schedule:
  #   - cron: '*/15 * * * *'
  # Controlled manual trigger for testing and research dispatch
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (logs actions without sending emails or mutating retry counts)'
        required: true
        default: true
        type: boolean
      test_recipient:
        description: 'Optional test recipient override (e.g. delivered@resend.dev)'
        required: false
        default: 'delivered@resend.dev'
        type: string

jobs:
  dispatch-unlock-emails:
    name: Dispatch Room 3 & 4 Unlock Emails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unlock Email Dispatcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ummiczxtncwvozgvqlih.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.test_recipient }}" ]; then
            ARGS="$ARGS --test-recipient=${{ inputs.test_recipient }}"
          fi
          node scripts/send_unlock_emails.mjs $ARGS
